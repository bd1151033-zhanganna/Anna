<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>張安娜 Anna Chang - 個人主頁</title>
    <style>
        :root {
            --bg-color: #faf8f5;
            --card-bg: #ffffff;
            --text-primary: #4a4a4a;
            --text-secondary: #8c8c8c;
            --accent-color: #d4a373;
            --accent-light: #fefae0;
            --border-color: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .header-section {
            background: linear-gradient(135deg, #fefae0 0%, #faedcd 100%);
            padding: 40px 30px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .name {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .title {
            font-size: 15px;
            color: var(--accent-color);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .quote {
            font-size: 14px;
            color: var(--text-secondary);
            font-style: italic;
            max-width: 80%;
            margin: 0 auto;
            position: relative;
        }

        .quote::before, .quote::after {
            content: '"';
            color: var(--accent-color);
            opacity: 0.5;
        }

        .content-section {
            padding: 30px;
        }

        .info-group {
            margin-bottom: 25px;
        }

        .info-group:last-child {
            margin-bottom: 0;
        }

        .group-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .group-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background-color: var(--border-color);
            margin-left: 15px;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            background-color: var(--accent-light);
            color: #a47e54;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(212, 163, 115, 0.2);
            transition: all 0.2s ease;
        }

        .badge:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .contact-list {
            list-style: none;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .contact-icon {
            width: 30px;
            height: 30px;
            background-color: var(--bg-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            color: var(--accent-color);
            font-size: 14px;
        }

        .contact-link {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .contact-link:hover {
            color: var(--accent-color);
        }

        @media (max-width: 480px) {
            .header-section {
                padding: 30px 20px;
            }
            .content-section {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="header-section">
            <div class="name">張安娜</div>
            <div class="title">黎明技術學院 數位多媒體系</div>
            <div class="quote">喜歡簡單生活，也喜歡認真對待每一件事。</div>
        </div>

        <div class="content-section">
            <div class="info-group">
                <div class="group-title">我的興趣</div>
                <div class="badge-container">
                    <span class="badge">📖 讀書</span>
                    <span class="badge">☁️ 睡覺</span>
                </div>
            </div>

            <div class="info-group">
                <div class="group-title">專業技能</div>
                <div class="badge-container">
                    <span class="badge">💻 寫代碼</span>
                    <span class="badge">➗ 微積分</span>
                </div>
            </div>

            <div class="info-group">
                <div class="group-title">聯繫方式</div>
                <ul class="contact-list">
                    <li class="contact-item">
                        <span class="contact-icon">✉️</span>
                        <a href="mailto:1151033@venusl.lit.edu.tw" class="contact-link">1151033@venusl.lit.edu.tw</a>
                    </li>
                    <li class="contact-item">
                        <span class="contact-icon">💬</span>
                        <span>Line ID: 張安娜</span>
                    </li>
                    <li class="contact-item">
                        <span class="contact-icon">📱</span>
                        <a href="https://instagram.com/changanna" target="_blank" class="contact-link">@changanna</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
